[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampio-mqtt"
dynamic = ["version"]
description = "Async client for the Ampio Smart Home MQTT protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "pszypowicz" }]
keywords = ["ampio", "mqtt", "home-assistant", "smart-home"]
dependencies = [
  # Floor: 2.2.0 moved aiomqtt to paho's VERSION2 callbacks, which normalize
  # CONNACK rejections to MQTT 5 reason codes on every wire protocol - the
  # auth detection in _connection.py reads those codes and would miss the
  # plain-int 3.1.1 codes older aiomqtt surfaces. 2.5.0 additionally makes
  # `Message.payload` always bytes and stops `__aexit__` swallowing
  # exceptions. `<3`: aiomqtt 3 drops paho (and with it the MqttError
  # hierarchy) and speaks MQTT 5 only.
  "aiomqtt>=2.5,<3",
]

[project.optional-dependencies]
# LAN discovery (`ampio_mqtt.discover`) only. Home Assistant provides
# `zeroconf` itself and `discover()` accepts its shared instance, so the
# primary consumer needs no extra; standalone callers opt in.
# Floor: the `AddressResolverIPv4` class discovery.py imports exists since
# 0.142.0 (python-zeroconf#1499); anything older fails at import.
discovery = ["zeroconf>=0.142"]

[project.urls]
Homepage = "https://github.com/pszypowicz/ampio-mqtt"
Issues = "https://github.com/pszypowicz/ampio-mqtt/issues"

# PEP 735 dev tooling; not part of the published package's metadata.
# ruff is pinned exactly so a new release cannot break CI without a
# reviewed bump (dependabot proposes them).
[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4",
  "mypy>=1.10",
  "ruff==0.16.3",
  # The discovery extra, so the test suite covers the discovery module.
  "zeroconf>=0.142",
]

[tool.hatch.version]
path = "src/ampio_mqtt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ampio_mqtt"]

[tool.hatch.build.targets.wheel.force-include]
"src/ampio_mqtt/py.typed" = "ampio_mqtt/py.typed"
"src/ampio_mqtt/_devtypes.json" = "ampio_mqtt/_devtypes.json"

[tool.hatch.build.targets.sdist]
include = [
  "src/ampio_mqtt/**/*.py",
  "src/ampio_mqtt/py.typed",
  "src/ampio_mqtt/_devtypes.json",
  "tests/**/*.py",
  "README.md",
  "CHANGELOG.md",
  "docs/**/*.md",
  "LICENSE",
  "NOTICES",
  "pyproject.toml",
]
exclude = [
  "tools/**",
  ".venv/**",
  ".pytest_cache/**",
]

[tool.ruff.lint]
# Beyond the default E/F set: import order, modern syntax, bugbear's
# footguns, simplifications, ruff's own checks, and the asyncio rules.
extend-select = ["I", "UP", "B", "SIM", "RUF", "ASYNC"]
# ASYNC109 flags async functions taking a `timeout` parameter, but timeout
# parameters are this library's deliberate public API shape - a config flow
# passes them as plain values instead of wrapping calls in asyncio.timeout.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
# Tests poll with `while ...: await asyncio.sleep(...)` on purpose; the
# asyncio.Event alternative would need production hooks that exist only
# for tests.
"tests/*" = ["ASYNC110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Strict in config, not only as a CI flag, so a local `mypy src/ampio_mqtt`
# checks exactly what CI checks.
[tool.mypy]
strict = true

# python-zeroconf does not list every public symbol in `__all__`, so
# `from zeroconf import AddressResolverIPv4` fails mypy's strict re-export
# check without this override.
[[tool.mypy.overrides]]
module = ["zeroconf", "zeroconf.*"]
implicit_reexport = true
