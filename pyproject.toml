[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampio-mqtt"
version = "1.1.0"
description = "Async client for the Ampio Smart Home MQTT protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "pszypowicz" }]
keywords = ["ampio", "mqtt", "home-assistant", "smart-home"]
dependencies = ["aiomqtt>=2.0.0,<3"]

[project.urls]
Homepage = "https://github.com/pszypowicz/ampio-mqtt"
Issues = "https://github.com/pszypowicz/ampio-mqtt/issues"

[project.optional-dependencies]
discovery = ["zeroconf>=0.131"]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ampio_mqtt"]

[tool.hatch.build.targets.wheel.force-include]
"src/ampio_mqtt/py.typed" = "ampio_mqtt/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  "src/ampio_mqtt/**/*.py",
  "src/ampio_mqtt/py.typed",
  "tests/**/*.py",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICES",
  "pyproject.toml",
]
exclude = [
  "tools/**",
  ".venv/**",
  ".pytest_cache/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# `zeroconf` is an optional runtime dependency (the `[discovery]` extra).
# Without the override, mypy emits `import-not-found` when the extra is
# absent and `unused-ignore` when per-line `# type: ignore` comments are
# present and the extra IS installed. The override keeps `discovery.py`
# free of suppression comments in both configurations: zeroconf ships
# `py.typed`, so real types are used when the extra is installed; without
# it, mypy treats the module as `Any`.
[[tool.mypy.overrides]]
module = ["zeroconf", "zeroconf.*"]
ignore_missing_imports = true
