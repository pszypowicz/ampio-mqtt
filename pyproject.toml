[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampio-mqtt"
version = "1.2.0"
description = "Async client for the Ampio Smart Home MQTT protocol"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "pszypowicz" }]
keywords = ["ampio", "mqtt", "home-assistant", "smart-home"]
dependencies = ["aiomqtt>=2.0.0,<3"]

[project.urls]
Homepage = "https://github.com/pszypowicz/ampio-mqtt"
Issues = "https://github.com/pszypowicz/ampio-mqtt/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4",
  "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ampio_mqtt"]

[tool.hatch.build.targets.wheel.force-include]
"src/ampio_mqtt/py.typed" = "ampio_mqtt/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  "src/ampio_mqtt/**/*.py",
  "src/ampio_mqtt/py.typed",
  "tests/**/*.py",
  "README.md",
  "CHANGELOG.md",
  "LICENSE",
  "NOTICES",
  "pyproject.toml",
]
exclude = [
  "tools/**",
  ".venv/**",
  ".pytest_cache/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
